  <rect x="830" y="270" width="350" height="120" rx="10" fill="#12233a" stroke="#82bbf6" stroke-width="1.5"/>
  <text x="848" y="298" fill="#e8f1fa" font-size="16" font-weight="700">三维查看器</text>
