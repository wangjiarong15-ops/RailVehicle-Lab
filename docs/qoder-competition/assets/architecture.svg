  <text x="848" y="344" fill="#bcd3e6" font-size="13">interactions.js：拾取 / 高亮 / 测点标签避让 / 辉光</text>
  <text x="848" y="366" fill="#bcd3e6" font-size="13">viewer-dock.js：15 实时控件 + 重置 / 导出 PNG</text>

  <rect x="430" y="330" width="330" height="120" rx="10" fill="#12233a" stroke="#82bbf6" stroke-width="1.5"/>
  <text x="448" y="358" fill="#e8f1fa" font-size="16" font-weight="700">app.js · 渲染生命周期</text>
  <text x="448" y="382" fill="#bcd3e6" font-size="13">单一 setAnimationLoop · 阻尼 orbit · 像素比上限</text>
  <text x="448" y="404" fill="#bcd3e6" font-size="13">一次性烘焙环境 / 接触阴影 · 共享贴图 · 粒子氛围</text>
  <text x="448" y="426" fill="#bcd3e6" font-size="13">tick → rig.pose + charts.setCursor（四视图同步）</text>

