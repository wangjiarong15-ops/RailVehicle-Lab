<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./viewer.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
  <title>三维转向架工作台</title>
</head>
<body>
  <main id="workbench" aria-label="三维转向架工作台">
    <header>
      <div><strong>RailVehicle 3D Studio</strong><span id="model-status">通用双轴转向架</span></div>
      <button id="vehicle-overview" type="button" aria-pressed="false" hidden>整车总览</button>
      <button id="vehicle-shell" type="button" aria-pressed="false" hidden>车体透视</button>
      <button id="vehicle-heat" type="button" aria-pressed="false" hidden>二系行程着色</button>
      <button id="wheelrail-forces" type="button" aria-pressed="false" hidden>接触力矢量</button>
      <button id="wheelrail-focus" type="button" aria-pressed="false" hidden>前轴接触局部</button>
      <select id="wheelrail-target" aria-label="轮轨观察部位" hidden>
        <option value="vehicle">整车</option><option value="front_frame">前转向架</option>
        <option value="rear_frame">后转向架</option><option value="front_wheel">前轮对</option>
        <option value="front_primary">前架一系</option><option value="front_secondary">前架二系</option>
      </select>
      <button id="wheelrail-shell" type="button" aria-pressed="false" hidden>隐藏车体</button>
      <button id="browse-parts" type="button" aria-controls="part-panel" aria-expanded="false" hidden>零件清单</button>
      <select id="surface-mode" aria-label="表面显示"><option value="solid">实体</option><option value="ghost">构架透视</option><option value="selected">所选零件透明</option><option value="wire">网格线框</option></select>
      <button id="full-screen" type="button" hidden>全屏</button>
      <select id="view" aria-label="视窗视角" disabled>
        <option>整体视图</option><option>侧视图</option><option>正视图</option>
        <option>俯视图</option><option>底视图</option>
      </select>
      <button id="focus" disabled type="button">聚焦零件</button>
      <button id="hide" disabled type="button">隐藏零件</button>
      <button id="restore" disabled type="button">恢复隐藏</button>
      <button id="measure" type="button" aria-pressed="false" disabled>两点测距</button>
      <button id="section-toggle" type="button" aria-controls="section-controls" aria-pressed="false" disabled>剖切视图</button>
      <button id="export-inspection" type="button" aria-describedby="export-status" disabled>导出检查图</button>
      <button id="copilot-inspection" type="button" hidden>记录当前检查用于 Copilot</button>
      <button id="bookmarks-toggle" type="button" aria-controls="bookmarks-controls" aria-expanded="false" disabled>检查视图</button>
      <button id="reset" disabled type="button">恢复视角</button>
      <div id="section-controls" hidden>
        <select id="section-axis" aria-label="剖切轴">
          <option value="x">X 纵向</option><option value="y">Y 横向</option><option value="z">Z 垂向</option>
        </select>
        <input id="section-position" type="range" aria-label="剖切位置" aria-valuetext="纵向 0.00 米" min="-2.7" max="2.7" step=".05" value="0">
        <output id="section-value" for="section-position">X = 0.00 m · 保留负侧</output>
        <button id="section-flip" type="button" aria-pressed="false">翻转保留侧</button>
      </div>
      <div id="bookmarks-controls" hidden>
        <input id="bookmark-name" type="text" aria-label="视图名称" placeholder="视图名称" maxlength="32">
        <button id="bookmark-save" type="button">保存当前视图</button>
        <select id="bookmark-select" aria-label="已保存视图"></select>
        <button id="bookmark-restore" type="button">恢复视图</button>
        <button id="bookmark-delete" type="button">删除视图</button>
        <button id="bookmark-export" type="button">导出书签</button>
        <button id="bookmark-import" type="button">导入书签</button>
        <input id="bookmark-file" type="file" accept=".json,application/json" hidden>
        <span id="bookmark-status" role="status"></span>
      </div>
    </header>
    <div id="workspace">
      <div id="stage">
        <div id="surface"></div>
        <div id="twin-panes" hidden aria-hidden="true"><span>基准计算</span><span>方案复算</span></div>
        <div id="twin-heat-note" hidden>二系横向计算行程绝对值 · 蓝 0 mm → 橙 20 mm</div>
        <div id="wheelrail-vector-note" hidden>绿 法向 50 kN/m · 橙 踏面切向 15 kN/m</div>
        <svg id="sensor-overlay" aria-label="传感器安装点与测量正方向" style="display:none">
          <defs><marker id="sensor-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M0 0L10 5L0 10Z" fill="#58dfb3"/></marker></defs>
          <g><line stroke="#58dfb3" stroke-width="3" marker-end="url(#sensor-arrow)"/>
            <circle r="5" stroke="#102e31" stroke-width="2" fill="#62f0bf"/><text x="8" y="-8"></text></g>
        </svg>
        <div id="labels" aria-hidden="true"></div>
        <svg id="mount-overlay" aria-hidden="true" style="display:none">
          <line stroke-dasharray="4 3"/>
          <g class="wheel-mount"><circle r="4"/><text x="8" y="12">轮侧</text></g>
          <g class="frame-mount"><circle r="4"/><text x="8" y="-5">构架侧</text></g>
        </svg>
        <div id="mount-readout" hidden><strong>模型安装距</strong> <span></span></div>
        <div id="axle-labels" aria-hidden="true" hidden><span class="tag rear">A 后轴</span><span class="tag front">B 前轴</span></div>
        <div id="axes" aria-hidden="true"><b>X</b> 纵向 <b>Y</b> 横向 <b>Z</b> 垂向</div>
        <p id="message" role="status">正在载入本地三维模型…</p>
      </div>
      <aside id="part-panel" aria-label="零件清单" hidden>
        <label for="part-query">查找零件</label>
        <input id="part-query" type="search" placeholder="名称、类别或编号" autocomplete="off">
        <p id="part-count" role="status"></p>
        <div id="part-results"></div>
        <div class="part-actions">
          <button id="show-part" type="button" disabled>恢复所选</button>
          <button id="isolate-part" type="button" aria-pressed="false" disabled>仅看所选</button>
        </div>
      </aside>
    </div>
    <section id="response" aria-label="计算响应时间轴" hidden>
      <div class="response-bar"><button id="sim-play" type="button">播放</button><button id="sim-reset" type="button">重置</button>
        <span id="sim-step" hidden><button id="sim-prev" type="button">前一帧</button>
          <button id="sim-next" type="button">后一帧</button></span>
        <select id="sim-rate" aria-label="计算播放速度"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
        <input id="sim-time" type="range" min="0" step="1" aria-label="计算样本">
        <output id="sim-values"></output></div>
      <svg id="response-plot" viewBox="0 0 1000 64" preserveAspectRatio="none" aria-label="计算悬挂行程曲线，点击定位">
        <path d="M0 32H1000" stroke="#51657a"/><path id="response-path" fill="none" stroke="#50d3c3" vector-effect="non-scaling-stroke"/>
        <path id="nominal-path" fill="none" stroke="#a7b4c4" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>
        <path id="rear-path" fill="none" stroke="#eab879" stroke-dasharray="6 2" vector-effect="non-scaling-stroke"/>
        <path id="observation-path" fill="none" stroke="#8bc8fb" stroke-linecap="round" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
        <line id="response-cursor" y1="0" y2="64" stroke="#ffbd69" stroke-width="2"/></svg>
      <div class="response-axis"><span id="response-scale"></span><span id="response-duration">0 – 6 s</span></div>
      <div id="axle-controls" hidden>
        <select id="axle-signal" aria-label="双轴曲线"><option value="travel">悬挂行程</option><option value="support">轨面输入</option></select>
        <button type="button" id="front-crest">B 前轴到凸顶</button>
        <button type="button" id="rear-crest">A 后轴到凸顶</button>
      </div>
      <div id="lateral-controls" hidden>
        <select id="lateral-signal" aria-label="横向与侧滚曲线">
          <option value="body_y_m">车体横移</option><option value="roll_rad">车体侧滚</option>
          <option value="accel_m_s2">车体横向加速度</option><option value="travel_m">二系横向相对行程</option>
          <option value="body_z_m" data-coupled hidden>车体垂向位移</option>
          <option value="body_z_accel_m_s2" data-coupled hidden>车体垂向加速度</option>
          <option value="body_y_velocity_m_s" data-coupled hidden>车体横向速度</option>
          <option value="body_z_velocity_m_s" data-coupled hidden>车体垂向速度</option>
          <option value="support_side_l_m" data-wheelrail hidden>前架左二系垂向行程</option>
          <option value="support_side_r_m" data-wheelrail hidden>前架右二系垂向行程</option>
          <option value="contact_q_min_kn" data-wheelrail hidden>最小法向轮重</option>
        </select>
        <button type="button" id="lateral-peak">定位本通道绝对峰值</button>
      </div>
    </section>
    <footer>
      <span id="inspection" aria-live="polite">点击零件查看名称、作用和安装位置</span>
      <span id="channel-context"></span>
      <span id="simulation-part-response"></span>
      <div id="measurement-panel" hidden>
        <span id="measurement-status" role="status"></span>
        <button id="clear-measurement" type="button" disabled>清除测点</button>
      </div>
      <span id="export-status" role="status" hidden></span>
      <span id="camera-link-status" role="status" hidden></span>
      <span class="legend"><i></i> 检查 <i></i> 异常</span>
    </footer>
  </main>
  <script type="module">
    const send = (type, data = {}) => parent.postMessage({isStreamlitMessage: true, type, ...data}, "*");
    let args, startup, update;
    const error = (cause) => {
      document.querySelector("#message").textContent =
        cause?.message === "assembly-unavailable" ? "本地装配资源缺失或损坏。请检查模型资源；其他分析页面仍可使用。" :
        args?.simulation ? "WebGL 不可用。可在下方「计算方法与数值样本」核对本次计算。" :
        "无法开启 WebGL 三维视图。请在「视角与部件」的「渲染方式」选择 Plotly 兼容模式，运行曲线和回放仍可使用。";
      document.querySelector("#workbench").dataset.status = "unavailable";
    };
    function resize() {
      if (!args) return;
      let viewport = screen.availHeight;
      try { viewport = parent.innerHeight; } catch {}
      const fraction = args.simulation ? .80 : viewport < 850 ? .61 : .67;
      const height = Math.max(280, Math.min(args.height, Math.round(viewport * fraction)));
      const root = document.querySelector("#workbench");
      if (root.style.height !== height + "px") {
        root.style.height = height + "px";
        send("streamlit:setFrameHeight", {height});
      }
    }
    try {
      parent.addEventListener("resize", resize);
      addEventListener("pagehide", () => parent.removeEventListener("resize", resize), {once: true});
    } catch {}
    window.addEventListener("message", (event) => {
      if (event.source !== parent || event.data?.type !== "streamlit:render") return;
      args = event.data.args;
      document.documentElement.dataset.theme = event.data.theme?.base === "light" ? "light" : "dark";
      resize();
      if (update) update(args);
      else startup ??= import("./viewer.js").then(({mount}) =>
        mount(value=>send("streamlit:setComponentValue", {value, dataType:"json"}))).then((apply) => {
        update = apply;
        update(args);
      }).catch(error);
    });
    send("streamlit:componentReady", {apiVersion: 1});
  </script>
</body>
</html>
