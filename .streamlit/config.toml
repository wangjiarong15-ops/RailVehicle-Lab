[server]
address = "127.0.0.1"

[client]
toolbarMode = "viewer"

[theme]
base = "dark"
font = "sans-serif"
baseFontSize = 14
headingFontSizes = ["30px", "25px", "18px", "16px", "14px", "12px"]
baseRadius = "0.4rem"

[theme.dark]
primaryColor = "#3B82F6"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#1C293C"
textColor = "#E5EDF8"
borderColor = "#263C55"
dataframeHeaderBackgroundColor = "#1B304A"
dataframeHeaderTextColor = "#E5EDF8"
chartCategoricalColors = ["#63ACFF", "#39CCBC", "#BA9BFF", "#F5B65A", "#FF737D", "#9BB3D0"]

[theme.dark.sidebar]
backgroundColor = "#131E30"
secondaryBackgroundColor = "#1C293C"
textColor = "#E5EDF8"
primaryColor = "#4D9DFF"

[theme.light]
primaryColor = "#176BCE"
backgroundColor = "#F1F5FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#142D4E"
borderColor = "#D7E2EF"
dataframeHeaderBackgroundColor = "#E7EFF8"
dataframeHeaderTextColor = "#142D4E"
chartCategoricalColors = ["#176BCE", "#0D9488", "#8258B5", "#B47713", "#C43D4A", "#526E8B"]

[theme.light.sidebar]
backgroundColor = "#E6EEF7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#142D4E"
primaryColor = "#176BCE"
