<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RailVehicle-Lab · 规则移植自动化测试</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 24px; background: #0b1521; color: #e3edf9;
      font: 13px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    h1 { font-size: 17px; margin-bottom: 4px; }
    p.sub { color: #a8bbce; font-size: 12px; margin-bottom: 16px; }
    #summary {
      display: inline-block; padding: 6px 16px; border-radius: 999px;
      border: 1px solid #34485e; margin-bottom: 16px; font-weight: 600;
    }
    #summary.pass { color: #6bd490; border-color: #6bd490; background: rgba(107, 212, 144, .12); }
    #summary.fail { color: #ff7a6b; border-color: #ff7a6b; background: rgba(255, 122, 107, .12); }
    ul { list-style: none; margin: 0; padding: 0; max-width: 980px; }
    li { padding: 5px 10px; border-left: 3px solid #34485e; margin-bottom: 4px; background: #122135; border-radius: 0 6px 6px 0; }
    li.ok { border-left-color: #6bd490; }
    li.bad { border-left-color: #ff7a6b; }
    li .tag { font-weight: 700; margin-right: 8px; }
    li.ok .tag { color: #6bd490; }
    li.bad .tag { color: #ff7a6b; }
    li .err { display: block; color: #fca549; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>规则移植自动化测试</h1>
  <p class="sub">基线：tests/expected.json（由原 RailVehicle-Lab Python 规则生成）· 全部计算在浏览器本地执行</p>
  <div id="summary">运行中…</div>
  <ul id="results"></ul>
  <script type="module" src="./tests.js"></script>
</body>
</html>
